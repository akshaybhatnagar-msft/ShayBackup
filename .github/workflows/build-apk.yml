name: Build Debug APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Generate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShayBackup-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            --title "Shay Backup — Build ${{ github.run_number }}" \
            --notes "Built from \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`" \
            --prerelease \
            "app/build/outputs/apk/debug/app-debug.apk#app-debug.apk"

      - name: Open issue with build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            let log = 'Build log not available';
            try {
              log = execSync('tail -c 8000 /tmp/build.log 2>/dev/null').toString();
            } catch(e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] Build failed — run #${context.runNumber}`,
              body: [
                `## Build failed on \`${context.ref}\``,
                ``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Commit:** \`${context.sha}\``,
                ``,
                `### Last 8 KB of Gradle output`,
                '```',
                log,
                '```'
              ].join('\n')
            });
